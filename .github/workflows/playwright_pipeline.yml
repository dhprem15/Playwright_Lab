name: Enterprise Playwright & API Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-automation-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Enterprise Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Browsers & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: 5. Execute Full Test Suite in Parallel (Headless)
        id: run_tests
        continue-on-error: true
        run: |
          mkdir -p reports
          pytest -n 2 --html=reports/cloud_execution_report.html --self-contained-html

      - name: 6. Upload HTML Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-execution-report
          path: reports/
          retention-days: 14

      - name: 7. Enforce Quality Gate Status
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "Quality Gate Failed: Some automated tests did not pass in cloud runner."
          exit 1